<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none';">
    <title>Antigravity Background</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/preload.js"></script>
    <script src="/appearance.js" defer></script>
    <script src="/app.js" defer></script>
</head>
<body>
    <header>
        <div class="header-brand">
            <h1>背景设置</h1>
            <p class="subtitle"><span>Antigravity Background</span><span id="plugin-version" class="version-badge" hidden></span></p>
        </div>
        <div class="header-actions">
            <a id="github-link" class="header-icon-link" href="https://github.com/KeS1Ke/Antigravity-Background" target="_blank" rel="noopener noreferrer" title="打开 GitHub 仓库" aria-label="打开 GitHub 仓库">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 1.5a6.5 6.5 0 0 0-2.05 12.67c.32.06.44-.14.44-.31v-1.1c-1.8.39-2.18-.87-2.18-.87-.3-.75-.72-.95-.72-.95-.59-.4.04-.39.04-.39.65.05 1 .67 1 .67.58 1 1.52.71 1.89.54.06-.42.23-.71.41-.87-1.44-.16-2.95-.72-2.95-3.2 0-.71.25-1.28.67-1.74-.07-.16-.29-.82.06-1.71 0 0 .55-.18 1.79.67a6.2 6.2 0 0 1 3.26 0c1.24-.85 1.79-.67 1.79-.67.35.89.13 1.55.06 1.71.42.46.67 1.03.67 1.74 0 2.49-1.51 3.04-2.96 3.2.23.2.44.6.44 1.21v1.79c0 .17.12.37.44.31A6.5 6.5 0 0 0 8 1.5Z"/></svg>
            </a>
            <button id="check-update" type="button" class="header-update-btn" title="检查 GitHub 仓库更新">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12.5 6a4.8 4.8 0 1 0 0 4M12.5 2.5V6H9"/></svg>
                <span>检查更新</span>
            </button>
            <label class="switch"><input id="enabled" type="checkbox" disabled><span>启用</span></label>
        </div>
    </header>
    <main>
        <details class="card preview-card" open>
            <summary><h2>图片预览</h2><span id="mode-label">适应</span></summary>
            <div id="preview" class="preview" role="img" aria-label="Antigravity 完整窗口外观示意预览：顶部栏、左侧导航、聊天区、消息气泡、Overview 面板、输入框与右侧栏">
                <span id="empty">选择一张背景图片</span>
            </div>
            <div class="image-actions">
                <label class="file-button">选择图片<input id="image" type="file" accept="image/png,image/jpeg,image/webp" disabled></label>
                <button id="remove" type="button" disabled>移除</button>
                <span class="file-hint">PNG / JPG / WebP</span>
            </div>
        </details>
        <div class="settings-columns">
            <div class="settings-column">
                <details class="card" open>
                    <summary><h2>图片布局</h2></summary>
                    <div class="modes" role="group" aria-label="图片布局">
                        <button type="button" data-mode="fill" disabled><span class="mode-icon fill"></span>填充</button>
                        <button type="button" data-mode="stretch" disabled><span class="mode-icon stretch"></span>拉伸</button>
                        <button type="button" data-mode="fit" disabled><span class="mode-icon fit"></span>适应</button>
                        <button type="button" data-mode="tile" disabled><span class="mode-icon tile"></span>平铺</button>
                    </div>
                </details>
                <details class="card">
                    <summary><h2>壁纸调整</h2></summary>
                    <div class="section-label reset-row"><button id="open-drag-preview" type="button" class="open-preview-button" disabled>打开预览</button><button id="reset" type="button" class="text-button" disabled>重置</button></div>
                    <div id="controls"></div>
                </details>
                <details class="card">
                    <summary><h2>设置页主题</h2></summary>
                    <div class="section-label"><label for="theme">主题</label>
                        <select id="theme" disabled><option value="system">跟随应用</option><option value="dark">深色</option><option value="light">浅色</option></select>
                    </div>
                </details>
            </div>
            <div class="settings-column">
                <details class="card">
                    <summary><h2>左侧边栏</h2></summary>
                    <div class="surface-toggles">
                        <label class="switch"><input id="left-sidebar-cover" type="checkbox" disabled> 显示底色</label>
                    </div>
                    <div id="left-sidebar-controls" class="surface-controls"></div>
                </details>
                <details class="card">
                    <summary><h2>右侧面板</h2></summary>
                    <div class="surface-toggles">
                        <label class="switch"><input id="sidebar-cover" type="checkbox" disabled> 显示底色</label>
                    </div>
                    <div id="sidebar-controls" class="surface-controls"></div>
                </details>
                <details class="card">
                    <summary><h2>输入框与对话框</h2></summary>
                    <div class="surface-toggles">
                        <label class="switch"><input id="composer-layered" type="checkbox" disabled> 原版分层级感</label>
                        <label class="switch"><input id="composer-cover" type="checkbox" disabled> 显示底色</label>
                    </div>
                    <div class="color-controls">
                        <div class="color-row"><label for="composerOuterColor">外圈颜色</label><input id="composerOuterColor" type="color" value="#131313" disabled><button type="button" data-reset-color="composerOuterColor" class="text-button" disabled>默认</button></div>
                        <div class="color-row"><label for="composerInnerColor">内部颜色</label><input id="composerInnerColor" type="color" value="#131313" disabled><button type="button" data-reset-color="composerInnerColor" class="text-button" disabled>默认</button></div>
                    </div>
                    <div id="composer-controls" class="surface-controls"></div>
                </details>
                <details class="card">
                    <summary><h2>Overview 面板</h2></summary>
                    <div class="surface-toggles">
                        <label class="switch"><input id="overview-cover" type="checkbox" disabled> 显示底色</label>
                    </div>
                    <div class="color-controls">
                        <div class="color-row"><label for="overviewOuterColor">外圈颜色</label><input id="overviewOuterColor" type="color" value="#131313" disabled><button type="button" data-reset-color="overviewOuterColor" class="text-button" disabled>默认</button></div>
                        <div class="color-row"><label for="overviewInnerColor">内部颜色</label><input id="overviewInnerColor" type="color" value="#131313" disabled><button type="button" data-reset-color="overviewInnerColor" class="text-button" disabled>默认</button></div>
                    </div>
                    <div id="overview-controls" class="surface-controls"></div>
                </details>
            </div>
        </div>
    </main>
    <footer>
        <p id="status" role="status" aria-live="polite"></p>
        <div class="footer-actions">
            <button id="retry-load" type="button" hidden>重试</button>
            <button id="repair-launch" type="button" hidden>修复快捷方式</button>
            <button id="discard" type="button" title="放弃未保存的实时预览并恢复已保存设置" disabled>还原</button>
            <button id="save" class="primary" type="button" disabled>保存设置</button>
        </div>
    </footer>
    <template id="sample-window-template">
        <div class="sample-window" aria-hidden="true">
            <div class="sample-titlebar"><span>Antigravity</span><span>─　□　×</span></div>
            <div class="sample-workspace">
                <div class="sample-side"><b>Antigravity</b><span>＋ 新对话</span><i></i><i></i><i></i><span class="sample-project">项目</span><i></i><i></i></div>
                <div class="sample-main">
                    <div class="sample-overview"><b>Overview</b><span>Review</span><span>Files</span></div>
                    <div class="sample-chat"><b>有什么可以帮你？</b><div class="sample-bubble"><div class="sample-bubble-inner"><span>调整对话框底色</span></div></div><i></i><i></i><i></i></div>
                    <div class="sample-composer"><div class="sample-composer-bar"><span>Temp ▾</span><span>Local ▾</span></div><div class="sample-composer-inner"><span>输入消息…</span><span>＋　 Gemini <em>↑</em></span></div></div>
                </div>
                <div class="sample-panel"><div class="sample-tabs">README.md　＋</div><div class="sample-panel-body"><b>README.md</b><i></i><i></i><i></i><span>Review</span><span>Open File</span><span>Terminal</span><span>Browser</span></div></div>
            </div>
            <div class="wallpaper"></div>
        </div>
    </template>
    <div id="drag-preview-modal" class="drag-modal" role="dialog" aria-modal="true" aria-label="背景拖拽调整预览" hidden>
        <div class="drag-modal-card">
            <div class="drag-modal-header">
                <div>
                    <h2>拖拽调整背景</h2>
                    <p id="drag-preview-meta" class="subtitle">拖拽移动 · 滚轮缩放</p>
                </div>
                <div class="drag-modal-actions">
                    <label class="switch"><input id="drag-preview-mask" type="checkbox" checked><span>显示界面</span></label>
                    <button id="drag-preview-reset" type="button" class="text-button">重置位置</button>
                    <button id="close-drag-preview" type="button" class="primary">完成</button>
                </div>
            </div>
            <div id="drag-preview-stage" class="preview drag-stage" role="application" tabindex="0" aria-label="可拖拽壁纸预览画布，可用方向键微调位置、加减键缩放">
                <span class="drag-stage-badge">拖拽/方向键移动 · 滚轮/+/- 缩放</span>
            </div>
        </div>
    </div>
    <div id="update-modal" class="drag-modal" role="dialog" aria-modal="true" aria-labelledby="update-modal-title" hidden>
        <div class="drag-modal-card update-modal-card">
            <div class="update-modal-header">
                <h2 id="update-modal-title">插件更新</h2>
                <button id="close-update-modal" type="button" class="icon-close-btn" aria-label="关闭">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
                </button>
            </div>
            <div class="update-modal-body">
                <div class="update-status-row">
                    <span id="update-status-icon" class="update-status-icon" aria-hidden="true">
                        <svg viewBox="0 0 20 20"><path id="update-status-path" d="M15.7 8a6 6 0 1 0-.2 4.5M16 3.5V8h-4.5"/></svg>
                    </span>
                    <div class="update-status-copy">
                        <strong id="update-status-text">检查更新</strong>
                        <span id="update-source-badge" class="update-source-badge" hidden></span>
                    </div>
                </div>
                <div class="update-progress-wrap">
                    <div class="update-progress-caption">
                        <span id="update-progress-label">准备检查</span>
                        <span id="update-progress-value"></span>
                    </div>
                    <div id="update-progress-track" class="update-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                        <i id="update-progress-fill"></i>
                    </div>
                </div>
                <dl class="update-meta-grid">
                    <div><dt>当前版本</dt><dd id="update-current-version">—</dd></div>
                    <div><dt>远端最新</dt><dd id="update-latest-version">—</dd></div>
                </dl>
                <div class="update-repo-row">
                    <a id="update-github-link" href="https://github.com/KeS1Ke/Antigravity-Background" target="_blank" rel="noopener noreferrer">
                        <span id="update-github-link-label">在 GitHub 查看仓库</span>
                        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3.5h6v6M12.5 3.5l-7 7"/></svg>
                    </a>
                    <button id="copy-github-link" type="button" class="text-button">复制链接</button>
                </div>
                <section id="update-notes-wrap" class="update-notes-wrap" hidden>
                    <h3 id="update-notes-label">更新内容</h3>
                    <p id="update-notes"></p>
                </section>
            </div>
            <div class="update-modal-footer">
                <span id="update-feedback" role="status" aria-live="polite"></span>
                <button id="update-action" type="button" class="primary" hidden>一键更新</button>
            </div>
        </div>
    </div>
</body>
</html>
